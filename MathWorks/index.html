<!DOCTYPE html>
<!-- MathWorks Homepage v1.1-auto-next: personal categories open in a lesson player and auto-advance after winner celebration when detectable. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(math) Playground!</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#172033;
  --muted:#5d6b82;
  --accent:#2563eb;
  --good:#16a34a;
  --warn:#f59e0b;
  --card:#fff;
  --shadow:0 12px 32px rgba(20,40,80,.14);
  --radius:22px;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 10%,rgba(255,255,255,.8),transparent 18%),
    linear-gradient(135deg,#e0f7ff,#fff9db 48%,#ecfdf5);
  color:var(--ink);
  min-height:100vh;
}
header{
  padding:14px 10px 8px;
  text-align:center;
}
.heroBanner{
  width:min(1386px,96vw);
  margin:0 auto 14px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 16px 42px rgba(20,40,80,.26);
  position:relative;
  background:#8ee6ff;
}
.heroBanner img{
  display:block;
  width:100%;
  height:auto;
}
.heroBanner::before{
  content:"";
  position:absolute;
  left:35%;
  right:35%;
  top:4%;
  height:22%;
  border-radius:999px;
  background:linear-gradient(180deg,rgba(104,203,255,.98),rgba(112,210,255,.92));
  box-shadow:0 0 20px rgba(104,203,255,.55);
  z-index:1;
  pointer-events:none;
}
.enterOverlay{
  position:absolute;
  left:50%;
  bottom:11%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
  pointer-events:none;
}
.enterBtn{
  border:0;
  background:transparent;
  color:white;
  font-size:clamp(1.55rem,5.8vw,2.65rem);
  letter-spacing:.08em;
  font-weight:1000;
  text-transform:uppercase;
  cursor:pointer;
  text-shadow:0 4px 0 rgba(37,99,235,.65),0 0 16px rgba(255,255,255,.95),0 6px 18px rgba(0,0,0,.42);
  animation:enterPulse 1.35s ease-in-out infinite;
  pointer-events:auto;
  padding:0;
  box-shadow:none;
}
.parentLinkRow{
  width:min(1386px,96vw);
  margin:-7px auto 10px;
  text-align:right;
  padding:0 8px;
}
.parentBtn{
  border:0;
  background:transparent;
  color:#2563eb;
  font-size:clamp(.78rem,2.9vw,.98rem);
  font-weight:850;
  cursor:pointer;
  padding:4px 0;
  box-shadow:none;
  text-decoration:none;
}
.parentBtn:hover,.parentBtn:focus{text-decoration:underline;outline:none}
@keyframes enterPulse{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.11);filter:brightness(1.18)}
}
.notice{
  max-width:920px;
  margin:12px auto 0;
  background:#fff8db;
  border:2px solid #facc15;
  border-radius:18px;
  padding:13px 16px;
  font-weight:650;
  color:#6b4e00;
  line-height:1.45;
}
main{
  width:min(1100px,94vw);
  margin:18px auto 48px;
}
.toolbar,.categoryPanel{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  margin:18px 0;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(10px);
  padding:14px;
  border-radius:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
.search,select,input.playName{
  flex:1 1 220px;
  border:2px solid #dbeafe;
  border-radius:16px;
  padding:14px 16px;
  font-size:1.05rem;
  outline:none;
  background:white;
}
button{
  border:0;
  border-radius:999px;
  padding:12px 16px;
  font-weight:850;
  font-size:1rem;
  cursor:pointer;
  background:var(--accent);
  color:white;
  box-shadow:0 6px 16px rgba(37,99,235,.22);
}
button.secondary{background:#475569}
button.good{background:var(--good)}
button.warn{background:var(--warn)}
.sectionTitle{margin:28px 4px 12px;font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.lesson{
  display:block;
  text-decoration:none;
  color:inherit;
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
  min-height:150px;
  box-shadow:var(--shadow);
  border:3px solid transparent;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
  position:relative;
  overflow:hidden;
}
.lesson:hover,.lesson:focus{
  transform:translateY(-3px);
  border-color:var(--accent);
  box-shadow:0 16px 38px rgba(37,99,235,.22);
  outline:none;
}
.lesson.pickMode{padding-left:58px}
.lessonCheck{position:absolute;left:16px;top:20px;width:28px;height:28px;accent-color:#2563eb}
.emoji{font-size:2.1rem;margin-bottom:8px;height:58px;display:flex;align-items:center}
.lesson h3{margin:0 0 8px;font-size:1.28rem}
.lesson p{margin:0;color:var(--muted);line-height:1.35}
.tag{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#1d4ed8;font-size:.82rem;font-weight:750}
.newBadge{position:absolute;top:13px;right:13px;background:var(--good);color:white;font-size:.75rem;padding:5px 8px;border-radius:999px;font-weight:800}
.status{flex:1 1 100%;font-weight:750;color:#334155;line-height:1.35}
.hidden{display:none!important}
.commentsSection{margin-top:40px;background:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}
footer{text-align:center;padding:28px 18px 48px;color:var(--muted)}
.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.82);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  z-index:999999;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  overflow:auto;
}
.modalBox{
  width:min(860px,96vw);
  max-height:calc(100vh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow:auto;
  background:white;
  border-radius:24px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.38);
}
.modalBox input,.modalBox textarea{
  width:100%;
  border:2px solid #dbeafe;
  border-radius:14px;
  padding:12px;
  margin:8px 0;
  font-size:1rem;
}
.modalBox textarea{min-height:320px;line-height:1.45}
.modalBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
.categoryEditCard{
  background:#f8fafc;
  border-radius:18px;
  padding:12px;
  margin:12px 0;
  box-shadow:0 8px 22px rgba(20,40,80,.08);
}
.categoryEditCard summary{
  cursor:pointer;
  font-size:1.2rem;
  font-weight:900;
  padding:8px;
}
.lessonChecks{
  border:2px solid #dbeafe;
  border-radius:16px;
  padding:10px;
  max-height:45vh;
  overflow:auto;
  background:white;
}
.lessonChecks label{
  display:block;
  padding:8px;
  font-weight:700;
}
.lessonChecks input{width:auto;margin-right:10px;transform:scale(1.25)}

.lessonPlayer{
  position:fixed;
  inset:0;
  z-index:1000000;
  background:#f8fbff;
  display:flex;
  flex-direction:column;
}
.lessonPlayerTop{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:8px 10px;
  background:white;
  box-shadow:0 4px 18px rgba(15,23,42,.18);
}
.lessonPlayerTitle{
  flex:1 1 180px;
  font-weight:900;
  color:#172033;
  line-height:1.25;
}
.lessonPlayerNote{
  flex:1 1 100%;
  font-size:.92rem;
  font-weight:750;
  color:#475569;
}
.lessonFrame{
  border:0;
  width:100%;
  flex:1 1 auto;
  background:white;
}
.lessonPlayer button{
  padding:9px 13px;
  font-size:.92rem;
}

@media(max-width:700px){
  header{padding-top:8px}
  .heroBanner{width:100vw;border-radius:0;margin-top:0}
  .heroBanner::before{left:34%;right:34%;top:2%;height:24%}
  .enterOverlay{bottom:10%; width:100%; padding:0 12px}
  .enterBtn{font-size:clamp(1.25rem,6vw,2rem)}
  .parentLinkRow{width:100vw;margin:-5px 0 10px;padding:0 12px;text-align:right}
}
</style>
</head>

}
function currentLessons(){
  let idx=selectedPlaylistIndex();
  if(idx===null) return LESSONS;
  let p=allPlaylists()[idx];
  if(!p) return LESSONS;
  return p.files.map(f=>LESSONS.find(l=>l.file===f)).filter(Boolean);
}

function isSelectedPersonalCategory(){
  let idx=selectedPlaylistIndex();
  let p=idx===null?null:allPlaylists()[idx];
  return !!(p && !p.built);
}
let activePathLessons=[], activeLessonIndex=0, activePathTimer=null, activeCountdownTimer=null, activeWinSeen=false;
function startLessonPath(file){
  let idx=selectedPlaylistIndex();
  let p=idx===null?null:allPlaylists()[idx];
  if(!p || p.built){ window.location.href=file; return; }
  activePathLessons=p.files.map(f=>LESSONS.find(l=>l.file===f)).filter(Boolean);
  activeLessonIndex=Math.max(0,activePathLessons.findIndex(l=>l.file===file));
  openLessonPlayer();
}
function openLessonPlayer(){
  clearLessonTimers();
  activeWinSeen=false;
  let lesson=activePathLessons[activeLessonIndex];
  if(!lesson){closeLessonPlayer();return;}
  let player=document.getElementById('lessonPlayer');
  if(!player){
    player=document.createElement('div');
    player.id='lessonPlayer';
    player.className='lessonPlayer';
    document.body.appendChild(player);
  }
  player.innerHTML='<div class="lessonPlayerTop"><button class="secondary" onclick="closeLessonPlayer()">Close</button><div class="lessonPlayerTitle"></div><button id="prevLessonBtn" class="secondary" onclick="previousPathLesson()">Back</button><button id="nextLessonBtn" class="good" onclick="nextPathLesson()">Next Lesson</button><div id="lessonPlayerNote" class="lessonPlayerNote">When the winner celebration appears, the next lesson will open automatically after a brief delay.</div></div><iframe id="lessonFrame" class="lessonFrame" title="MathWorks lesson"></iframe>';
  player.querySelector('.lessonPlayerTitle').textContent=(activeLessonIndex+1)+' of '+activePathLessons.length+': '+lesson.title;
  player.querySelector('#prevLessonBtn').disabled=activeLessonIndex<=0;
  player.querySelector('#nextLessonBtn').textContent=activeLessonIndex>=activePathLessons.length-1?'Finish':'Next Lesson';
  document.body.style.overflow='hidden';
  const frame=player.querySelector('#lessonFrame');
  frame.onload=()=>startWinnerWatch();
  frame.src=lesson.file;
}
function closeLessonPlayer(){
  clearLessonTimers();
  let player=document.getElementById('lessonPlayer');
  if(player) player.remove();
  document.body.style.overflow='';
}
function previousPathLesson(){
  if(activeLessonIndex>0){activeLessonIndex--;openLessonPlayer();}
}
function nextPathLesson(){
  if(activeLessonIndex<activePathLessons.length-1){activeLessonIndex++;openLessonPlayer();}
  else {closeLessonPlayer(); alert('Category complete!');}
}
function clearLessonTimers(){
  if(activePathTimer){clearInterval(activePathTimer);activePathTimer=null;}
  if(activeCountdownTimer){clearInterval(activeCountdownTimer);activeCountdownTimer=null;}
}
function startWinnerWatch(){
  if(activePathTimer) clearInterval(activePathTimer);
  activeWinSeen=false;
  activePathTimer=setInterval(checkWinnerAndAutoNext,900);
}
function checkWinnerAndAutoNext(){
  if(activeWinSeen) return;
  const frame=document.getElementById('lessonFrame');
  const note=document.getElementById('lessonPlayerNote');
  if(!frame || !frame.contentWindow) return;
  let doc=null;
  try{doc=frame.contentDocument || frame.contentWindow.document;}catch(e){
    if(note) note.textContent='Auto-next needs the lesson to be opened from the same website. Use the Next Lesson button if needed.';
    clearLessonTimers();
    return;
  }
  if(!doc || !doc.body) return;
  let text=(doc.body.innerText||'').toLowerCase();
  let celebrationWords=/you are a winner|winner|congratulations|great job|lesson complete|all done|finished|you did it/.test(text);
  let celebrationNode=doc.querySelector('[id*="winner" i],[class*="winner" i],[id*="celebrat" i],[class*="celebrat" i],[id*="confetti" i],[class*="confetti" i],[id*="final" i],[class*="final" i]');
  let visibleCelebration=false;
  if(celebrationNode){
    try{
      let st=frame.contentWindow.getComputedStyle(celebrationNode);
      let r=celebrationNode.getBoundingClientRect();
      visibleCelebration=st.display!=='none' && st.visibility!=='hidden' && Number(st.opacity)!==0 && r.width>0 && r.height>0;
    }catch(e){visibleCelebration=true;}
  }
  if(celebrationWords || visibleCelebration){
    activeWinSeen=true;
    if(activePathTimer){clearInterval(activePathTimer);activePathTimer=null;}
    let seconds=4;
    if(note) note.textContent=(activeLessonIndex<activePathLessons.length-1)?'Winner! Next lesson opens in '+seconds+' seconds…':'Winner! This was the last lesson in this category.';
    if(activeLessonIndex>=activePathLessons.length-1) return;
    activeCountdownTimer=setInterval(()=>{
      seconds--;
      if(note) note.textContent='Winner! Next lesson opens in '+seconds+' seconds…';
      if(seconds<=0){
        clearInterval(activeCountdownTimer);activeCountdownTimer=null;
        nextPathLesson();
      }
    },1000);
  }
}
function makeLessonCard(lesson){const a=document.createElement('a'); a.className='lesson'+(mode==='create'?' pickMode':''); a.href=mode==='create'?'#':lesson.file; let checked=pickSet.has(lesson.file)?'checked':''; a.innerHTML=(lesson.badge?'<div class="newBadge">'+lesson.badge+'</div>':'')+(mode==='create'?'<input class="lessonCheck" type="checkbox" '+checked+' aria-label="Select '+lesson.title+'">':'')+'<div class="emoji">'+(lesson.emoji||'📘')+'</div><h3>'+lesson.title+'</h3><p>'+lesson.description+'</p><span class="tag">'+lesson.category+'</span>'; if(mode==='create'){a.addEventListener('click',e=>{e.preventDefault(); pickSet.has(lesson.file)?pickSet.delete(lesson.file):pickSet.add(lesson.file); renderLessons(searchBox.value); updateStatus();})} else if(isSelectedPersonalCategory()){a.addEventListener('click',e=>{e.preventDefault(); startLessonPath(lesson.file);})} return a;}
function renderLessons(filter=''){grid.innerHTML=''; const q=filter.trim().toLowerCase(); currentLessons().filter(l=>(l.title+' '+l.description+' '+l.category).toLowerCase().includes(q)).forEach(l=>grid.appendChild(makeLessonCard(l))); if(!grid.children.length) grid.innerHTML='<p>No lessons found. Try another search word.</p>'; let idx=selectedPlaylistIndex(); listTitle.textContent=idx===null?'Lessons':allPlaylists()[idx].name;}
function updateStatus(){if(mode==='create') statusEl.textContent='New Category: selected '+pickSet.size+' lesson(s). Check lessons, then tap Create Category and Name/Save.'; else statusEl.textContent='Choose a category, create your own, or edit your saved categories.';}
function setMode(m){mode=m; createBtn.classList.toggle('hidden',m!=='create'); nameSaveBtn.classList.add('hidden'); clearBtn.classList.toggle('hidden',m!=='create'); if(m==='personal') openPersonalEditor(); if(m==='admin') askPassword(); updateStatus(); renderLessons(searchBox.value)}
function handleCategoryMenu(){
  const val=categoryMenu.value;
  if(val==='action:create') { setMode('create'); return; }
  if(val==='action:personal') { setMode('personal'); return; }
  if(val==='action:admin') { setMode('admin'); return; }
  if(mode!=='categories') mode='categories';
  createBtn.classList.add('hidden'); nameSaveBtn.classList.add('hidden'); clearBtn.classList.add('hidden');
  updateStatus(); renderLessons(searchBox.value);
}
searchBox.addEventListener('input',e=>renderLessons(e.target.value)); categoryMenu.addEventListener('change',handleCategoryMenu); clearBtn.onclick=()=>{pickSet.clear(); renderLessons(searchBox.value); updateStatus();}; createBtn.onclick=()=>{if(!pickSet.size) return alert('Please check at least one lesson first.'); createBtn.classList.add('hidden'); nameSaveBtn.classList.remove('hidden'); statusEl.textContent='Now tap Name/Save to give this custom category a name.'}; nameSaveBtn.onclick=()=>openNameSave();
function openModal(html){modalContent.innerHTML=html; modal.classList.remove('hidden'); document.body.style.overflow='hidden'; modal.scrollTop=0;} function closeModal(){modal.classList.add('hidden'); modalContent.innerHTML=''; document.body.style.overflow=''; if(categoryMenu.value.startsWith('action:')){categoryMenu.value='all'; mode='categories'; createBtn.classList.add('hidden'); nameSaveBtn.classList.add('hidden'); clearBtn.classList.add('hidden'); updateStatus(); renderLessons(searchBox.value);}}
function openInstructions(){let txt=localStorage.getItem('mw_parent_instructions')||DEFAULT_INSTRUCTIONS; openModal('<h2>Instructions to Parents</h2><p style="color:#64748b;font-weight:750">Edit this text anytime. It is saved on this device.</p><textarea id="instructionsText"></textarea><div class="modalBtns"><button class="good" onclick="saveInstructions()">Save Instructions</button><button class="secondary" onclick="closeModal()">Close</button></div>'); document.getElementById('instructionsText').value=txt;}
function saveInstructions(){localStorage.setItem('mw_parent_instructions',document.getElementById('instructionsText').value); alert('Instructions saved on this device.');}
function openNameSave(){openModal('<h2>Name/Save Category</h2><input id="pname" class="playName" placeholder="Example: Maria Week 1"><div class="modalBtns"><button class="secondary" onclick="closeModal()">Cancel</button><button class="good" onclick="saveNamedPlaylist()">Save</button></div>')}
function saveNamedPlaylist(){let name=document.getElementById('pname').value.trim(); if(!name) return alert('Please enter a category name.'); let arr=savedCustom(); arr.push({name,files:[...pickSet]}); saveCustom(arr); pickSet.clear(); closeModal(); populatePlaylists('playlist:'+(allPlaylists().length-1)); setMode('categories');}
function checksHTML(files=[]){return '<div class="lessonChecks">'+LESSONS.map(l=>'<label><input type="checkbox" value="'+l.file+'" '+(files.includes(l.file)?'checked':'')+'> '+l.title+'</label>').join('')+'</div>'}
function openPersonalEditor(){let arr=savedCustom(); let html='<h2>Edit My Categories</h2><p style="color:#64748b;font-weight:750">These categories are saved on this device. Open a category, rename it, check/uncheck lessons, then save.</p>'; if(!arr.length) html+='<p><b>No personal categories saved on this device yet.</b></p>'; arr.forEach((p,i)=>{html+='<details class="categoryEditCard"><summary>⭐ '+p.name+'</summary><input id="cname_'+i+'" value="'+escapeHtml(p.name)+'">'+checksHTML(p.files)+'<div class="modalBtns"><button class="good" onclick="savePersonalCategory('+i+')">Save Category</button><button class="warn" onclick="deletePersonalCategory('+i+')">Delete</button></div></details>'}); html+='<div class="modalBtns"><button class="secondary" onclick="closeModal()">Close</button></div>'; openModal(html);}
function savePersonalCategory(i){let arr=savedCustom(); let name=document.getElementById('cname_'+i).value.trim(); if(!name) return alert('Please enter a name.'); let card=document.getElementById('cname_'+i).closest('details'); let files=[...card.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value); arr[i]={name,files}; saveCustom(arr); populatePlaylists(categoryMenu.value); alert('Category saved on this device.'); openPersonalEditor();}
function deletePersonalCategory(i){let arr=savedCustom(); if(confirm('Delete this personal category?')){arr.splice(i,1); saveCustom(arr); populatePlaylists(categoryMenu.value); openPersonalEditor();}}
function askPassword(){if(admin) return openAdminEditor(); openModal('<h2>Admin Password</h2><p>Only Admin can edit permanent built-in categories.</p><input id="pw" type="password" placeholder="Password"><div class="modalBtns"><button class="secondary" onclick="closeModal()">Cancel</button><button onclick="checkPassword()">Enter</button></div>');}
function checkPassword(){const typed=(document.getElementById('pw').value||'').trim(); if(ADMIN_PASSWORDS.includes(typed)){admin=true; openAdminEditor();} else alert('Wrong password. Try: mathworks');}
function openAdminEditor(){let html='<h2>Admin Edit Permanent Categories</h2><p style="color:#64748b;font-weight:750">Edit built-in categories, then Commit Changes to copy a new index.html code for GitHub.</p>'; PLAYLISTS.forEach((p,i)=>{html+='<details class="categoryEditCard"><summary>📚 '+p.name+'</summary><input id="bname_'+i+'" value="'+escapeHtml(p.name)+'">'+checksHTML(p.files)+'<div class="modalBtns"><button class="good" onclick="saveBuiltCategory('+i+')">Save Category</button><button class="warn" onclick="deleteBuiltCategory('+i+')">Delete</button></div></details>'}); html+='<div class="modalBtns"><button onclick="addBuiltCategory()">Add Category</button><button class="warn" onclick="commitChanges()">Commit Changes</button><button class="secondary" onclick="closeModal()">Close</button></div>'; openModal(html);}
function addBuiltCategory(){PLAYLISTS.push({name:"New Category",files:[]}); populatePlaylists(categoryMenu.value); openAdminEditor();}
function saveBuiltCategory(i){let name=document.getElementById('bname_'+i).value.trim(); let card=document.getElementById('bname_'+i).closest('details'); let files=[...card.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value); PLAYLISTS[i]={name,files}; populatePlaylists(categoryMenu.value); alert('Built-in category saved in this page. Commit Changes to make it permanent in GitHub.'); openAdminEditor();}
function deleteBuiltCategory(i){if(confirm('Delete this built-in category?')){PLAYLISTS.splice(i,1); populatePlaylists(categoryMenu.value); openAdminEditor();}}
function commitChanges(){const replacement='let PLAYLISTS = '+JSON.stringify(PLAYLISTS,null,2)+';'; let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML; html=html.replace(/let PLAYLISTS = [\s\S]*?;\nconst grid=/, replacement+'\nconst grid='); openModal('<h2>Updated index.html Code Ready</h2><p>Tap copy, then paste over your GitHub index.html.</p><div class="modalBtns"><button onclick="copyExportCode()">COPY ENTIRE INDEX CODE</button><button class="secondary" onclick="closeModal()">Close</button></div><textarea id="exportCodeBox" readonly style="height:42vh"></textarea>'); setTimeout(()=>{document.getElementById('exportCodeBox').value=html;},50);}
async function copyExportCode(){let box=document.getElementById('exportCodeBox'); box.focus(); box.select(); let ok=false; try{await navigator.clipboard.writeText(box.value); ok=true;}catch(e){try{ok=document.execCommand('copy')}catch(e2){}} alert(ok?'Copied.':'If copy was blocked, tap in the selected box and use Copy.');}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
window.closeLessonPlayer=closeLessonPlayer; window.previousPathLesson=previousPathLesson; window.nextPathLesson=nextPathLesson; window.closeModal=closeModal; window.openInstructions=openInstructions; window.saveInstructions=saveInstructions; window.saveNamedPlaylist=saveNamedPlaylist; window.openPersonalEditor=openPersonalEditor; window.savePersonalCategory=savePersonalCategory; window.deletePersonalCategory=deletePersonalCategory; window.checkPassword=checkPassword; window.openAdminEditor=openAdminEditor; window.addBuiltCategory=addBuiltCategory; window.saveBuiltCategory=saveBuiltCategory; window.deleteBuiltCategory=deleteBuiltCategory; window.commitChanges=commitChanges; window.copyExportCode=copyExportCode;
populatePlaylists(); renderLessons(); updateStatus();
</script>
