
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Times Table</title>
<style>
body{font-family:Arial,sans-serif;background:#eef7ff;margin:0;padding:12px;text-align:center}
h1{color:#1565a8;margin:8px 0}
#panel{border:3px solid #8fc4ea;border-radius:20px;padding:12px;background:#fff;max-width:820px;margin:auto}
input{width:60px;height:50px;font-size:28px;text-align:center;border:3px solid #6da9d8;border-radius:10px}
#ans{background:#ffd8ea;border-color:#e94d97}
button{padding:10px 24px;font-size:22px;border-radius:25px;border:none;background:#1d6fb5;color:#fff;margin:10px}
#stopBtn,#tableBtn{background:#e5edf4;color:#24435f}
input[readonly]{background:#f8fbff;color:#17324d}
.tablewrap.hidden{display:none}
.practiceOptions{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
flex-wrap:wrap;
margin:0 0 12px;
font-size:18px;
font-weight:700;
color:#24435f;
}
.practiceOptions select{
font-size:18px;
padding:8px 12px;
border:2px solid #7caed3;
border-radius:12px;
background:#fff;
color:#17324d;
}
.hiddenControl{display:none}
#msg{font-size:28px;font-weight:bold;color:#168048;height:36px}
.tablewrap{display:flex;justify-content:center;margin-top:14px}
table{border-collapse:collapse;width:min(100%,760px);table-layout:fixed;border:4px solid #355a77}
th,td{border:1px solid #9fb7c9;font-size:clamp(10px,2.8vw,18px);height:clamp(24px,6vw,44px);padding:0}
thead th{border-bottom:4px solid #355a77;background:#dfefff}
tbody th{border-right:4px solid #355a77;background:#dfefff}
td.diag{background:#9fd5f5;color:#0b4f82;font-weight:900;border:2px solid #4f9dca}
td.above{background:#e4faf5}
td.below{background:#f1e9ff}
.rowhi,.colhi{background:#fff17a!important;color:#142f49!important}
.hit{background:#ffcf3d!important;color:#b00040!important;font-weight:900;font-size:clamp(14px,4vw,24px)}

.cornerCell{
  border-right:4px solid #355a77 !important;
  border-bottom:4px solid #355a77 !important;
  font-weight:900;
  background:#dfefff;
}

#celebrate{display:none;position:fixed;inset:0;background:rgba(15,23,42,.88);z-index:999;color:white;align-items:center;justify-content:center;text-align:center;flex-direction:column;padding:20px}#celebrate .big{font-size:4.5rem;animation:pulse .9s infinite}@keyframes pulse{50%{transform:scale(1.15)}}.donateBtn{display:inline-block;margin-top:22px;padding:16px 28px;border-radius:18px;background:#f59e0b;color:#172033;font-weight:900;font-size:1.3rem;text-decoration:none;border:4px solid #92400e;box-shadow:0 8px 20px rgba(0,0,0,.25)}.confetti{position:fixed;top:-40px;z-index:2001;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:0}}#flashOverlay{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:2000}.flashOn{animation:flashAnim .22s linear 8}@keyframes flashAnim{0%{opacity:0}

#winnerCloseBtn{
  position:absolute;
  top:18px;
  right:18px;
  width:52px;
  height:52px;
  border-radius:50%;
  border:0;
  background:#e5edf4;
  color:#17324d;
  font-size:34px;
  line-height:1;
  font-weight:700;
  z-index:2100;
}
#continuePracticeBtn{
  display:inline-block;
  margin-top:18px;
  padding:14px 24px;
  border-radius:18px;
  border:3px solid #0f4f7f;
  background:#1d6fb5;
  color:white;
  font-size:1.2rem;
  font-weight:900;
}

</style>
</head>
<body>
<h1>Times Table</h1>
<div id="panel">
<div class="practiceOptions">
<label for="modeSelect">Practice:</label>
<select id="modeSelect" onchange="changeMode()">
<option value="random">Random</option>
<option value="rowOrder">By row in order</option>
<option value="rowRandom">By row random</option>
<option value="missingFactor">Missing factor</option>
</select>

<label id="rowLabel" for="rowSelect" class="hiddenControl">Row:</label>
<select id="rowSelect" class="hiddenControl" onchange="changeRow()">
<option value="1">1</option><option value="2">2</option><option value="3">3</option>
<option value="4">4</option><option value="5">5</option><option value="6">6</option>
<option value="7">7</option><option value="8">8</option><option value="9">9</option>
<option value="10">10</option>
</select>
</div>

<input id="a" type="number" min="1" max="10" readonly aria-label="First number"> × <input id="b" type="number" min="1" max="10" readonly aria-label="Second number"> = <input id="ans" type="number" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-label="Product">
<br>
<button id="doneBtn" onclick="check()">Done</button>
<button id="stopBtn" onclick="toggleStop()">Stop</button>
<button id="tableBtn" onclick="toggleTable()">Hide Table</button>
<div id=msg></div>
</div>
<div class="tablewrap"><table id=t></table></div>
<script src="MathWorksWinner.js"></script>
<script src="MathWorksSounds.js"></script>
<script>
const table = document.getElementById('t');
const firstBox = document.getElementById('a');
const secondBox = document.getElementById('b');
const answerBox = document.getElementById('ans');
const message = document.getElementById('msg');
const doneButton = document.getElementById('doneBtn');
const stopButton = document.getElementById('stopBtn');
const tableButton = document.getElementById('tableBtn');
const modeSelect = document.getElementById('modeSelect');
const rowSelect = document.getElementById('rowSelect');
const rowLabel = document.getElementById('rowLabel');

let tableHTML='<thead><tr><th class="cornerCell">×</th>';
for(let c=1;c<=10;c++) tableHTML+=`<th id="c${c}">${c}</th>`;
tableHTML+='</tr></thead><tbody>';

for(let r=1;r<=10;r++){
  tableHTML+=`<tr><th id="r${r}">${r}</th>`;
  for(let c=1;c<=10;c++){
    const symmetryClass=r===c?'diag':(r<c?'above':'below');
    tableHTML+=`<td id="x${r}_${c}" class="${symmetryClass}">${r*c}</td>`;
  }
  tableHTML+='</tr>';
}
tableHTML+='</tbody>';
table.innerHTML=tableHTML;

let running=true;
let currentA=1;
let currentB=1;
let nextTimer=null;
let correctStreak=0;
let alreadyCelebrated=false;
let orderedColumn=1;
let previousRandomColumn=0;
let missingSide='first';
let missingAnswer=0;

function clearHi(){
  document.querySelectorAll('.rowhi,.colhi,.hit').forEach(
    element=>element.classList.remove('rowhi','colhi','hit')
  );
}

function randomFactor(){
  return Math.floor(Math.random()*10)+1;
}

function selectedMode(){
  return modeSelect.value;
}

function selectedRow(){
  return Number(rowSelect.value);
}

function changeMode(){
  const mode=selectedMode();
  const usesRow=mode==='rowOrder'||mode==='rowRandom';
  rowLabel.style.display=usesRow?'inline-block':'none';
  rowSelect.style.display=usesRow?'inline-block':'none';
  orderedColumn=1;
  previousRandomColumn=0;

  if(!running){
    running=true;
    stopButton.textContent='Stop';
    doneButton.disabled=false;
  }
  newProblem();
}

function changeRow(){
  orderedColumn=1;
  previousRandomColumn=0;

  if(!running){
    running=true;
    stopButton.textContent='Stop';
    doneButton.disabled=false;
  }
  newProblem();
}

function chooseProblem(){
  const mode=selectedMode();

  if(mode==='random'){
    currentA=randomFactor();
    currentB=randomFactor();
    missingSide='none';
    return;
  }

  if(mode==='missingFactor'){
    currentA=randomFactor();
    currentB=randomFactor();
    missingSide=Math.random()<0.5?'first':'second';
    missingAnswer=missingSide==='first'?currentA:currentB;
    return;
  }

  currentA=selectedRow();
  missingSide='none';

  if(mode==='rowOrder'){
    currentB=orderedColumn;
    orderedColumn=orderedColumn===10?1:orderedColumn+1;
    return;
  }

  let nextColumn=randomFactor();
  if(nextColumn===previousRandomColumn){
    nextColumn=nextColumn===10?1:nextColumn+1;
  }
  previousRandomColumn=nextColumn;
  currentB=nextColumn;
}

function highlightProblem(){
  const r=currentA;
  const c=currentB;

  document.getElementById(`r${r}`).classList.add('rowhi');
  document.getElementById(`c${c}`).classList.add('colhi');

  for(let i=1;i<=10;i++){
    document.getElementById(`x${r}_${i}`).classList.add('rowhi');
    document.getElementById(`x${i}_${c}`).classList.add('colhi');
  }

  const productCell=document.getElementById(`x${r}_${c}`);
  productCell.classList.remove('rowhi','colhi');
  productCell.classList.add('hit');
}

function newProblem(keepMessage=false){
  if(!running) return;

  clearTimeout(nextTimer);
  clearHi();
  if(!keepMessage) message.textContent='';
  chooseProblem();

  firstBox.readOnly=true;
  secondBox.readOnly=true;
  answerBox.readOnly=false;

  firstBox.value=currentA;
  secondBox.value=currentB;
  answerBox.value='';

  if(selectedMode()==='missingFactor'){
    const product=currentA*currentB;
    answerBox.value=product;
    answerBox.readOnly=true;

    if(missingSide==='first'){
      firstBox.value='';
      firstBox.readOnly=false;
    }else{
      secondBox.value='';
      secondBox.readOnly=false;
    }
  }

  highlightProblem();

  const activeBox=selectedMode()==='missingFactor'
    ? (missingSide==='first'?firstBox:secondBox)
    : answerBox;

  activeBox.focus({preventScroll:true});
}

function check(){
  if(!running) return;

  const mode=selectedMode();
  const activeBox=mode==='missingFactor'
    ? (missingSide==='first'?firstBox:secondBox)
    : answerBox;

  if(activeBox.value.trim()===''){
    message.textContent=mode==='missingFactor'?'Enter the missing factor.':'Enter the product.';
    message.style.color='#b33';
    activeBox.focus();
    return;
  }

  const entered=Number(activeBox.value);
  const expected=mode==='missingFactor'?missingAnswer:currentA*currentB;

  if(entered===expected){
    correctStreak++;
    message.textContent='You are so correct!';
    message.style.color='#168048';

    if(correctStreak>=10 && !alreadyCelebrated){
      alreadyCelebrated=true;
      clearTimeout(nextTimer);
      celebrate();
    }else{
      /* Shared transition cue; the Winner branch above skips this sound. */
      if(window.MathWorksSounds) MathWorksSounds.transition();

      /* Load the next problem immediately during the Done-button tap.
         The feedback remains visible briefly while the next answer box is already active. */
      newProblem(true);
      nextTimer=setTimeout(()=>{ message.textContent=''; },700);
    }
  }else{
    correctStreak=0;
    alreadyCelebrated=false;
    message.textContent='Try again';
    message.style.color='#b33';
    activeBox.focus({preventScroll:true});
    activeBox.select();
  }
}

function toggleTable(){
  const wrap=document.querySelector('.tablewrap');
  const hidden=wrap.classList.toggle('hidden');
  tableButton.textContent=hidden?'Show Table':'Hide Table';
}

function toggleStop(){
  running=!running;
  clearTimeout(nextTimer);

  if(running){
    stopButton.textContent='Stop';
    doneButton.disabled=false;
    newProblem();
  }else{
    stopButton.textContent='Start';
    doneButton.disabled=true;
    message.textContent='Stopped';
    message.style.color='#24435f';
    answerBox.blur();
  }
}


function celebrateLegacy(){
  running=false;
  doneButton.disabled=true;
  stopButton.textContent='Start';

  const mode=selectedMode();
  const mastery=document.getElementById('winnerMastery');

  if(mode==='random'){
    mastery.textContent='You mastered Random Multiplication!';
  }else if(mode==='missingFactor'){
    mastery.textContent='You mastered Missing Factors!';
  }else{
    mastery.textContent='You mastered the '+selectedRow()+' Times Table!';
  }

  document.getElementById('celebrate').style.display='flex';
  flashScreen();
  launchConfetti();
  playTrumpets();
}

function celebrate(){
  running=false;
  doneButton.disabled=true;
  stopButton.textContent='Start';

  const mode=selectedMode();
  let mastery='You mastered this lesson!';

  if(mode==='random'){
    mastery='You mastered Random Multiplication!';
  }else if(mode==='missingFactor'){
    mastery='You mastered Missing Factors!';
  }else{
    mastery='You mastered the '+selectedRow()+' Times Table!';
  }

  if(window.MathWorksWinner && typeof MathWorksWinner.show==='function'){
    MathWorksWinner.show({
      message: mastery,
      continueText: 'Continue Practice',
      onContinue: continuePractice
    });
  }else{
    /* Safety fallback: if the shared module is unavailable, use the proven old WinnerWindow. */
    celebrateLegacy();
  }
}


function closeWinner(){
  document.getElementById('celebrate').style.display='none';
  correctStreak=0;
  alreadyCelebrated=false;
  running=true;
  doneButton.disabled=false;
  stopButton.textContent='Stop';
  newProblem();
}

function continuePractice(){
  correctStreak=0;
  alreadyCelebrated=false;
  running=true;
  doneButton.disabled=false;
  stopButton.textContent='Stop';
  newProblem();
}

window.closeWinner=closeWinner;
window.continuePractice=continuePractice;

function flashScreen(){
  const f=document.getElementById('flashOverlay');
  f.classList.remove('flashOn');
  void f.offsetWidth;
  f.classList.add('flashOn');
}

function launchConfetti(){
  const pieces=['🎉','🎊','✨','⭐','🎈','🥳'];
  for(let i=0;i<100;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.textContent=pieces[Math.floor(Math.random()*pieces.length)];
    c.style.left=(Math.random()*100)+'vw';
    c.style.fontSize=(24+Math.random()*30)+'px';
    c.style.animationDuration=(3+Math.random()*4)+'s';
    c.style.animationDelay=(Math.random()*0.8)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),8000);
  }
}

function playTrumpets(){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    const ctx=new AudioContext();
    if(ctx.state==='suspended')ctx.resume();

    function tone(freq,start,dur,type,vol){
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(freq,ctx.currentTime+start);
      gain.gain.setValueAtTime(0.0001,ctx.currentTime+start);
      gain.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+start+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+start+dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime+start);
      osc.stop(ctx.currentTime+start+dur+0.05);
    }

    [523,659,784,1046,784,1046,1318].forEach((n,i)=>{
      tone(n,i*0.18,0.35,'sawtooth',0.35);
      tone(n*1.01,i*0.18,0.35,'square',0.10);
    });
  }catch(e){}
}

[firstBox,secondBox,answerBox].forEach(box=>{
  box.addEventListener('keydown',event=>{
    if(event.key==='Enter') check();
  });
});

window.changeMode=changeMode;
window.changeRow=changeRow;
window.check=check;
window.toggleTable=toggleTable;
window.toggleStop=toggleStop;


function applyAssignedPracticeSettings(){
  const params=new URLSearchParams(window.location.search);
  const assignedMode=params.get('mode');
  const assignedRow=params.get('row');
  const allowed=['random','rowOrder','rowRandom','missingFactor'];

  if(assignedMode && allowed.includes(assignedMode)){
    modeSelect.value=assignedMode;
  }
  if(assignedRow && Number(assignedRow)>=1 && Number(assignedRow)<=10){
    rowSelect.value=String(Number(assignedRow));
  }

  const usesRow=modeSelect.value==='rowOrder'||modeSelect.value==='rowRandom';
  rowLabel.style.display=usesRow?'inline-block':'none';
  rowSelect.style.display=usesRow?'inline-block':'none';
  orderedColumn=1;
  previousRandomColumn=0;
}

applyAssignedPracticeSettings();
newProblem();
</script>

<div id="flashOverlay"></div>
<div id="celebrate">
  <button id="winnerCloseBtn" onclick="closeWinner()" aria-label="Close">×</button>
  <div class="big">🎉0️⃣🎺</div>
  <h2>You are a Winner!</h2>
  <p id="winnerMastery">10 correct answers in a row!</p>
  <button id="continuePracticeBtn" onclick="continuePractice()">Continue Practice</button>
  <a class="donateBtn"
     href="https://www.paypal.com/donate/?hosted_button_id=DMMXW39SYGURC"
     target="_blank">❤️ Support this work!</a>
</div>
<div style="text-align:center;font-size:11px;color:#6f8397;margin:16px 0 8px;">
Times Table build 22 — SAFE Modular Winner + Transitions
</div>
</body>
</html>
